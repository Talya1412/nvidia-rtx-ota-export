name: ota-release

# Runs the OTA pre-release exporter weekly. It only publishes a new GitHub Release
# when NVIDIA's OTA manifest reports a version newer than the latest release tag.

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA channel to track'
        type: choice
        default: Staging
        options:
          - Staging
          - Production

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export + release on new OTA version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./New-OtaRelease.ps1 -Channel '${{ github.event.inputs.channel || 'Staging' }}'
