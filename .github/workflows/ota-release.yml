name: ota-release

# Runs the OTA pre-release exporter weekly. It only publishes a new GitHub Release
# when NVIDIA's OTA manifest reports a version newer than the latest release tag.

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: 'Source to track (Newest = per-component newest across OTA + Streamline SDK)'
        type: choice
        default: Newest
        options:
          - Newest
          - Sdk
          - Staging
          - Production

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (shared OTA logic)
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Fixture integration tests (frozen release artifacts)
        shell: pwsh
        run: ./tests/run-tests.ps1 -Integration

      - name: Export + release on new OTA version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./New-OtaRelease.ps1 -Channel '${{ github.event.inputs.channel || 'Newest' }}'
