name: ota-release

# Polls every 3 hours. A cheap pre-gate (New-OtaRelease.ps1 step 0) exits in seconds when no
# tracked feed changed; only a real feed change triggers the heavy export + release step.

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours; the cheap pre-gate exits in seconds when nothing changed
  workflow_dispatch:
    inputs:
      channel:
        description: 'Source to track (Newest = per-component newest across OTA + Streamline SDK + NVIDIA/DLSS)'
        type: choice
        default: Newest
        options:
          - Newest
          - Sdk
          - Staging
          - Production

concurrency:
  group: ota-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (shared OTA logic)
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Fixture integration tests (frozen release artifacts)
        shell: pwsh
        run: ./tests/run-tests.ps1 -Integration

      - name: Export + release on new OTA version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./New-OtaRelease.ps1 -Channel '${{ github.event.inputs.channel || 'Newest' }}'
